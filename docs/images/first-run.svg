<svg xmlns="http://www.w3.org/2000/svg" width="920" height="220" viewBox="0 0 920 220" role="img" aria-label="first run four steps">
  <rect width="920" height="220" fill="#f8fafc"/>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="28" y="48" width="190" height="124" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="56" cy="76" r="14" fill="#0f172a"/>
    <text x="56" y="81" text-anchor="middle" font-size="13" fill="#fff">1</text>
    <text x="80" y="82" font-size="14" font-weight="600" fill="#0f172a">部署 Relay</text>
    <text x="48" y="114" font-size="12" fill="#475569">公网机器跑服务端</text>
    <text x="48" y="136" font-size="12" fill="#475569">配好 TLS 证书</text>
    <text x="48" y="158" font-size="12" fill="#475569">打开 Web 控制台</text>
    <text x="236" y="116" font-size="20" fill="#94a3b8">→</text>
    <rect x="260" y="48" width="190" height="124" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="288" cy="76" r="14" fill="#4f46e5"/>
    <text x="288" y="81" text-anchor="middle" font-size="13" fill="#fff">2</text>
    <text x="312" y="82" font-size="14" font-weight="600" fill="#0f172a">邀请设备</text>
    <text x="280" y="114" font-size="12" fill="#475569">为 office-pc 发邀请</text>
    <text x="280" y="136" font-size="12" fill="#475569">授权 home-laptop</text>
    <text x="280" y="158" font-size="12" fill="#475569">邀请只能用一次</text>
    <text x="468" y="116" font-size="20" fill="#94a3b8">→</text>
    <rect x="492" y="48" width="190" height="124" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="520" cy="76" r="14" fill="#0e7490"/>
    <text x="520" y="81" text-anchor="middle" font-size="13" fill="#fff">3</text>
    <text x="544" y="82" font-size="14" font-weight="600" fill="#0f172a">被控端上线</text>
    <text x="512" y="114" font-size="12" fill="#475569">填入设备 ID 与密钥</text>
    <text x="512" y="136" font-size="12" fill="#475569">粘贴邀请码注册</text>
    <text x="512" y="158" font-size="12" fill="#475569">装成 Windows 服务</text>
    <text x="700" y="116" font-size="20" fill="#94a3b8">→</text>
    <rect x="724" y="48" width="168" height="124" rx="14" fill="#ecfeff" stroke="#67e8f9"/>
    <circle cx="752" cy="76" r="14" fill="#0891b2"/>
    <text x="752" y="81" text-anchor="middle" font-size="13" fill="#fff">4</text>
    <text x="776" y="82" font-size="14" font-weight="600" fill="#0f172a">连过去</text>
    <text x="744" y="114" font-size="12" fill="#475569">控制端点连接</text>
    <text x="744" y="136" font-size="12" fill="#475569">mstsc 自动弹出</text>
    <text x="744" y="158" font-size="12" fill="#475569">登录 Windows 即可</text>
  </g>
</svg>
